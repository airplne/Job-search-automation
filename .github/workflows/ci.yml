name: CI

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_search_automation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_search_automation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_search_automation?schema=public
      NODE_ENV: test
      SESSION_SECRET: ci-secret-value
      ALLOW_DEV_AUTH: "true"
      ALLOW_DEV_AUDIT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check product boundary
        run: bash scripts/check-product-boundary.sh
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply committed migrations
        run: npm run db:migrate:ci
      - name: Seed source policies
        run: npm run db:seed
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
